function home(){app(`<div class="card"><div class="big">🕵️</div><h1>Thám tử Dữ liệu</h1><p>5 màn, ${Z.reduce((a,z)=>a+z.qs.length,0)} thử thách, khoảng 1 giờ. Phân loại, kiểm tra tính đại diện, săn lỗi bảng thống kê và tính toán.</p><p class="mut">Đúng được 100 điểm, chuỗi đúng liên tiếp cộng thêm. Dùng gợi ý bị trừ 40 điểm. Mỗi màn có 3 tim, hết tim thì làm lại màn đó. Bạn có 3 lượt gợi ý cho cả game.</p><button class="go" onclick="start()">Bắt đầu</button></div>`)}
function start(){S={z:0,i:0,h:3,sc:0,st:0,hn:3,ok:0,n:0};intro()}
function intro(){const z=Z[S.z];S.i=0;S.h=3;app(`<div class="card"><div class="big">${z.ic}</div><h2>${z.n}</h2><p>${z.d}</p><p class="mut">${z.qs.length} câu</p><button class="go" onclick="ask()">Vào màn</button></div>`)}
function ask(){const z=Z[S.z],q=z.qs[S.i];S.sel=q.t=='sort'?q.it.map(()=>null):null;S.hint=false;S.done=false;
let body='';
if(q.t=='mc')body=q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join('');
if(q.t=='num')body=`<input id="v" inputmode="decimal" placeholder="Nhập đáp số (dùng dấu phẩy hoặc chấm)" onkeydown="if(event.key=='Enter')chk()"><button class="go" onclick="chk()">Trả lời</button>`;
if(q.t=='sort')body=q.it.map((x,k)=>`<div class="row" id="r${k}"><span>${x[0]}</span><button class="tg" onclick="tog(${k},0)">Định tính</button><button class="tg" onclick="tog(${k},1)">Định lượng</button></div>`).join('')+`<button class="go" onclick="chk()">Kiểm tra</button>`;
app(`<div class="hud"><span>${z.ic} ${z.n.split(':')[0]}</span><span>${'❤️'.repeat(S.h)}${'🖤'.repeat(3-S.h)}</span><span>⭐ ${S.sc}</span><span>🔥 ${S.st}</span></div><div class="bar"><i style="width:${S.i/z.qs.length*100}%"></i></div><div class="card"><p class="mut">Câu ${S.i+1}/${z.qs.length}</p><p><b>${q.q}</b></p><div id="qa">${body}</div><div class="acts" id="ha"><button onclick="hint()" ${S.hn?'':'disabled'}>💡 Gợi ý (${S.hn})</button></div><div id="fb"></div></div>`);
const v=document.getElementById('v');if(v)v.focus()}
function hint(){const q=Z[S.z].qs[S.i];if(S.hint||!S.hn||S.done)return;S.hint=true;S.hn--;document.getElementById('ha').innerHTML=`<p class="mut">💡 ${q.h}</p>`}
function tog(k,v){if(S.done)return;S.sel[k]=v;document.querySelectorAll(`#r${k} .tg`).forEach((b,j)=>b.classList.toggle('on',j==v))}
function pick(k){if(S.done)return;const q=Z[S.z].qs[S.i];document.querySelectorAll('.opt').forEach((b,j)=>{if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('bad')});fin(k==q.a)}
function chk(){if(S.done)return;const q=Z[S.z].qs[S.i];
if(q.t=='num'){const raw=document.getElementById('v').value.trim().replace(',','.').replace(/\s/g,'');const x=parseFloat(raw);if(isNaN(x)){document.getElementById('fb').innerHTML='<p class="mut">Hãy nhập một số.</p>';return}fin(Math.abs(x-q.a)<0.011)}
else{if(S.sel.includes(null)){document.getElementById('fb').innerHTML='<p class="mut">Hãy chọn loại cho tất cả các dòng.</p>';return}
let all=true;q.it.forEach((x,k)=>{const r=S.sel[k]==x[1];if(!r)all=false;document.getElementById('r'+k).classList.add(r?'ok':'bad');if(!r)document.getElementById('r'+k).insertAdjacentHTML('beforeend',`<small>→ ${T[x[1]]}</small>`)});fin(all)}}
function fin(ok){S.done=true;S.n++;const z=Z[S.z],q=z.qs[S.i];document.getElementById('qa').classList.add('lock');document.getElementById('ha').innerHTML='';
let msg;if(ok){const g=100+Math.min(S.st,5)*20-(S.hint?40:0);S.sc+=g;S.st++;S.ok++;msg=`✅ Chính xác! +${g} điểm`}
else{S.h--;S.st=0;msg='❌ Chưa đúng. Mất 1 tim.'+(q.t=='num'?` Đáp số: <b>${q.a}</b>.`:'')}
let btn;if(!ok&&S.h<=0)btn='<button class="go" onclick="intro()">Hết tim, làm lại màn này</button>';
else{const last=S.i>=z.qs.length-1;btn=`<button class="go" onclick="next()">${last?'Hoàn thành màn':'Câu tiếp'}</button>`}
document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><p><b>${msg}</b></p><p>${q.e}</p></div><div class="acts">${btn}</div>`;
if(!ok&&S.h<=0)S.n=Math.max(0,S.n)}
function next(){const z=Z[S.z];if(S.i<z.qs.length-1){S.i++;ask();return}
const b=S.h*30;S.sc+=b;
if(S.z<Z.length-1){app(`<div class="card"><div class="big">🎉</div><h2>Qua ${z.n.split(':')[0]}!</h2><p>Thưởng ${S.h} tim còn lại: +${b} điểm</p><p>Tổng điểm: ⭐ ${S.sc}</p><button class="go" onclick="S.z++;intro()">Màn tiếp theo</button></div>`)}
else end()}
function end(){const p=S.ok/S.n,r=p>=.9?'Thám tử Huyền thoại 🏆':p>=.75?'Chuyên gia Dữ liệu 🥇':p>=.55?'Thám tử tập sự 🥈':'Tân binh chăm chỉ 🥉';
app(`<div class="card"><div class="big">🏁</div><h1>${r}</h1><p>Điểm: <b>⭐ ${S.sc}</b></p><p>Đúng ${S.ok} trên ${S.n} lần trả lời (${Math.round(p*100)}%)</p><p class="mut">Các câu sai thường nằm ở bẫy “thứ Hai, thứ Tư… là chữ”, hoặc quên cộng tổng phần trăm. Chơi lại để phá kỉ lục.</p><button class="go" onclick="start()">Chơi lại</button></div>`)}
home();
</script></body></html>
